<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParkShare — Community Parking</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">P</span>
      <h1>ParkShare</h1>
    </div>
    <nav class="header-actions">
      <button id="trafficToggle" class="btn btn-secondary" title="Toggle road traffic layer">🚦 Traffic</button>
      <button id="reportBtn" class="btn btn-primary">+ Report Spot</button>
    </nav>
  </header>

  <!-- Busyness legend -->
  <div class="legend">
    <span class="legend-title">Community busyness:</span>
    <span class="legend-item"><span class="dot dot-green"></span> Not busy</span>
    <span class="legend-item"><span class="dot dot-yellow"></span> Medium</span>
    <span class="legend-item"><span class="dot dot-red"></span> Busy</span>
    <span class="legend-item"><span class="dot dot-gray"></span> Stale</span>
  </div>

  <main class="home-layout">
    <section class="map-section">
      <div id="map"></div>
      <button id="locateBtn" class="locate-btn" title="My Location">📍</button>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>Nearby Free Spots</h2>
        <span id="spotCount" class="badge">0</span>
      </div>
      <div id="spotList" class="spot-list">
        <p class="empty-state">Loading parking spots...</p>
      </div>
    </section>
  </main>

  <!-- Report Spot Modal -->
  <div id="reportModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Report a Parking Spot</h3>
        <button class="close-btn" data-close="reportModal">×</button>
      </div>
      <form id="reportForm">
        <label>
          Spot Name
          <input type="text" id="spotName" required placeholder="e.g. Main St near Café" />
        </label>
        <label>
          Number of Free Spots
          <input type="number" id="freeSpots" min="0" max="50" value="3" required />
        </label>
        <label>
          Default Parking Duration (minutes)
          <input type="number" id="duration" min="5" max="1440" value="60" required />
        </label>
        <label>
          Notes / Restrictions
          <textarea id="notes" rows="3" placeholder="e.g. Free after 6PM, no parking on Sundays"></textarea>
        </label>
        <p class="hint">📍 Click on the map to set the spot location, or use your current location.</p>
        <div id="coordsDisplay" class="coords">No location selected</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="useMyLocationBtn">Use My Location</button>
          <button type="submit" class="btn btn-primary">Save Spot</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Configuration & data must load before Google Maps callback fires -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <!-- Google Maps API loader. callback=initMap is required. -->
  <script>
    (function() {
      const script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + GOOGLE_MAPS_API_KEY + '&callback=initMap&v=weekly';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
